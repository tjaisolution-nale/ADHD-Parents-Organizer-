# n8n dla bota „Dom”. Uruchamiane przez scripts/setup.sh.
# Wersję obrazu ustawia N8N_VERSION w n8n/.env (ta sama, której już używasz).
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:?Ustaw N8N_VERSION w n8n/.env}
    restart: unless-stopped
    env_file: .env
    environment:
      # Węzeł Code bota czyta konfigurację z $env
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro

volumes:
  n8n_data:
