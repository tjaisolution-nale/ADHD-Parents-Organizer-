name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Workflow n8n są aktualne
        run: npm run check:n8n
      - name: Brak sekretów w repo
        run: git ls-files -z | xargs -0 node scripts/lib/secret-scan.mjs
